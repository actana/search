name: CI

on:
  pull_request:
    # The three defaults plus `ready_for_review`, named explicitly because
    # naming `types` at all *replaces* the defaults rather than extending them.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      # The train, and nothing else. `main` advances by a fast-forward of a
      # train whose every commit this workflow already gated, so a second run
      # there would re-prove what the train proved.
      - "beta/**"
  workflow_dispatch:

concurrency:
  # A train push must never cancel the one before it; a superseded pull-request
  # run has nothing anyone is waiting on.
  group: ${{ startsWith(github.ref, 'refs/heads/beta/') && format('ci-train-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/beta/') }}

permissions:
  contents: read

env:
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "12.4.1"
  # Every action is pinned to a full commit SHA with the tag in a comment. A
  # moving tag is a supply-chain hole with a friendly name on it, and this repo
  # gates its npm dependencies on a seven-day release age for the same reason
  # (SECURITY.md) — leaving CI's own dependencies floating would make that
  # pointless.

jobs:
  # The repo conventions, in one job:
  #   1. the PR title follows Conventional Commits (it becomes the squash subject)
  #   2. every commit message in the PR follows them too
  #   3. the branch name matches <type>/<kebab-description>
  conventions:
    name: Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # commitlint is deliberately not a dependency of this repo — it would
      # churn the lockfile for a check only CI and a local hook run. The config
      # is self-contained (an inline plugin, no imports), so copying that one
      # file beside a throwaway install is enough.
      - name: Install commitlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/commitlint"
          cp commitlint.config.mjs "$RUNNER_TEMP/commitlint/"
          cd "$RUNNER_TEMP/commitlint"
          npm init -y >/dev/null
          npm install --silent @commitlint/cli @commitlint/config-conventional

      # Held in a shell variable and piped, never interpolated into the script
      # — a PR title is attacker-controlled text.
      - name: Lint the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          title="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .title)"
          printf '%s' "$title" | "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
            --config "$RUNNER_TEMP/commitlint/commitlint.config.mjs" \
            --cwd "$GITHUB_WORKSPACE" --verbose

      - name: Lint commits in PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/commitlint/node_modules/.bin/commitlint" \
            --config "$RUNNER_TEMP/commitlint/commitlint.config.mjs" \
            --cwd "$GITHUB_WORKSPACE" \
            --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|ci|revert)\/[a-z0-9]+([._-][a-z0-9]+)*$'

          # Bots name their own branches and cannot be asked to stop. Their
          # commit messages are still linted by the step above — that is the
          # part that reaches the train.
          if echo "$BRANCH" | grep -qE '^(dependabot|renovate)/'; then
            echo "✅ Branch name '$BRANCH' is bot-generated — convention not enforced."
            exit 0
          fi

          # A promotion pull request's head *is* `beta/x.y.z`, a branch class
          # the convention above does not know about.
          if echo "$BRANCH" | grep -qE '^beta/[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "✅ Branch name '$BRANCH' is a release train."
            exit 0
          fi

          if echo "$BRANCH" | grep -qE "$PATTERN"; then
            echo "✅ Branch name '$BRANCH' is valid."
          else
            echo "❌ Branch name '$BRANCH' violates the convention."
            echo ""
            echo "Expected: <type>/<kebab-case-description>"
            echo "Types: feat|feature|fix|bugfix|hotfix|release|chore|docs|refactor|perf|test|ci|revert"
            echo "Rules: lowercase only; words separated by hyphens; no consecutive/leading/trailing separators."
            exit 1
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` is eslint *and* `scripts/check-strip-types.mjs`. The second
      # one catches the class of breakage eslint and tsc both wave through:
      # TypeScript syntax that Node cannot strip. See the script's own comment.
      - run: pnpm lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    # Postgres with pgvector, so the migration and partition suites run for
    # real rather than skipping. They gate on `SEARCH_TEST_DATABASE_URL`, so a
    # contributor without a database still gets a green local run.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d search_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SEARCH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/search_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      # `scripts/run-unit-tests.mjs`, not `pnpm -r test`: it runs every package
      # suite to completion and names the failing ones, instead of bailing on
      # the first red and hiding the rest.
      - run: pnpm test

  # The service has to start.
  #
  # `tsc --noEmit` proves the types are consistent and says nothing about
  # whether Node can load the files: Node runs this TypeScript by stripping
  # types, and a constructor parameter property type-checks perfectly and
  # refuses to load. `pnpm lint` catches that statically; this job catches
  # everything else — a bad import specifier, a missing runtime dependency, a
  # migration that does not apply — by actually running the migrator against a
  # real pgvector database, under plain `node`, with no loader and no bundler.
  boot:
    name: Boot — migrator under plain Node
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: search_boot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d search_boot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Apply the migrations with plain node
        env:
          SEARCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/search_boot
        run: node packages/search/src/db/migrate-cli.ts
      # Twice, because the migrator runs at every boot and a second start must
      # be a no-op rather than an error.
      - name: And again — a boot against a migrated database is a no-op
        env:
          SEARCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/search_boot
        run: node packages/search/src/db/migrate-cli.ts
      # Every other runtime module, loaded the same way — and then asked to run.
      #
      # The migrator proves one entry point loads. This proves all 166 of them
      # do, and it calls `url-guard.validateExternalUrl`, which is the check
      # that catches the class of defect the test suite structurally cannot:
      # vitest applies CJS/ESM interop shims, so `import * as ipaddr from
      # 'ipaddr.js'` was a working namespace under the runner and a namespace
      # with nothing on it under `node`. Every URL-validating write on a live
      # instance answered `400 ipaddr.isValid is not a function` with a green
      # 1057-test gate. `pnpm test` runs this script too (through
      # `__tests__/plain-node-imports.test.ts`); it is here as well because this
      # is the job that runs things the way the image does, and it needs no
      # database.
      - name: Import every runtime module with plain node
        run: node --experimental-strip-types scripts/import-runtime-modules.mjs

  # `--prod`: the gate is about what ships. A check that goes red for reasons
  # unrelated to the change in front of it is a check everyone learns to click
  # past.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
